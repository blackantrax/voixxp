name: Deploiement VoixXP

# Publie VoixXP sur Vercel (projet « voixxp ») a chaque push sur main.
# Prerequis : le secret de depot VERCEL_TOKEN (Settings > Secrets and variables > Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement-voixxp
  cancel-in-progress: false

env:
  PROJET_VERCEL: voixxp
  EQUIPE_VERCEL: blackantraxs-projects

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifier le code (types, lint, build)
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Auditer la compatibilite des voix Piper
        run: node scripts/audit-voices.mjs --candidats

      # Genere un extrait avec chaque voix dans un vrai navigateur (~10 min). Bloquant, mais
      # seulement quand le commit touche aux voix ou aux moteurs (ou lancement manuel).
      - name: Tester chaque voix dans Chromium
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && \
             ! git diff --name-only HEAD~1 HEAD | grep -qE '^(src/lib/voices\.ts|src/lib/tts\.ts|workers/|scripts/build-workers\.mjs|package(-lock)?\.json|tests/)'; then
            echo "Aucun changement de voix ou de moteur : test complet saute."
            exit 0
          fi
          npx playwright install --with-deps chromium
          npx next start -p 3000 &
          npx wait-on -t 60000 http://localhost:3000
          node tests/voix.mjs http://localhost:3000

      # Copie hors du depot git : sinon Vercel bloque le build (auteur non verifiable sur un depot prive).
      - name: Preparer le dossier a publier
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/voixxp" && mkdir -p "$RUNNER_TEMP/voixxp"
          tar --exclude=./.git --exclude=./.github --exclude=./.claude --exclude=./founder --exclude=./node_modules --exclude=./.next --exclude=./public/workers -cf - . | tar -xf - -C "$RUNNER_TEMP/voixxp"

      - name: Verifier la presence du jeton Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "::error::Secret VERCEL_TOKEN absent : Settings > Secrets and variables > Actions."; exit 1; }

      - name: Lier, ouvrir au public et deployer
        id: deployer
        working-directory: ${{ runner.temp }}/voixxp
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel project add "$PROJET_VERCEL" --scope "$EQUIPE_VERCEL" --token "$VERCEL_TOKEN" || echo "Projet deja existant."
          vercel link --yes --project "$PROJET_VERCEL" --scope "$EQUIPE_VERCEL" --token "$VERCEL_TOKEN"
          projet=$(node -p "require('./.vercel/project.json').projectId")
          equipe=$(node -p "require('./.vercel/project.json').orgId")
          # Site public (page de vente) : on leve l'authentification Vercel par defaut.
          code=$(curl -sS -o /tmp/p.json -w '%{http_code}' -X PATCH "https://api.vercel.com/v9/projects/$projet?teamId=$equipe" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null,"framework":"nextjs"}')
          [ "$code" = "200" ] || { echo "::error::Mise a jour du projet refusee (HTTP $code)"; cat /tmp/p.json; exit 1; }
          url=$(vercel deploy --prod --yes --scope "$EQUIPE_VERCEL" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deploiement : $url"

      - name: Verifier le site en ligne
        run: |
          set -euo pipefail
          URL="https://$PROJET_VERCEL.vercel.app"
          curl -sSf --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/accueil.html "$URL"
          grep -q "VoixXP" /tmp/accueil.html || { echo "::error::Accueil inattendu"; exit 1; }
          curl -sSf -o /dev/null "$URL/studio"
          curl -sSf -o /dev/null "$URL/workers/piper.js"
          curl -sSf -o /dev/null "$URL/workers/kokoro.web.js"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$URL/api/waitlist")
          [ "$code" = "400" ] || { echo "::error::/api/waitlist -> $code (400 attendu)"; exit 1; }
          echo "En ligne : $URL"
